name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate shared application
        run: pnpm validate

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Apply BeBlog app icons
        run: pnpm tauri icon assets/app-icon.png

      - name: Build universal debug APK
        run: pnpm tauri android build --debug --apk

      - name: List generated APKs
        run: find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeBlog-Maker-Tools-0.2.2-Build-007-Android-Debug-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
