[package]
name = "beblog-maker-tools"
version = "0.2.1"
description = "BeBlog Maker Tools"
authors = ["Bernd Jöpen"]
edition = "2021"

[lib]
name = "beblog_maker_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
